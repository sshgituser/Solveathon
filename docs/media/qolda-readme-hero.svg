  <title id="title">Qolda — Упражнение E02 · Разгибание локтя</title>
  <desc id="desc">Локальная проверка разгибания локтя по видео на GPU. На схеме плечо и локоть неподвижны, а запястье движется по дуге до выпрямления руки. Это иллюстрация, не результат измерения.</desc>
